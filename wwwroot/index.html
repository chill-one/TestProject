<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <h1>File Browser</h1>

    <form id="search-form">
        <input
            id="search-input"
            type="search"
            placeholder="Search files and folders"
        />
        <button type="submit">Search</button>
    </form>

    <form id="upload-form">
        <input id="file-input" type="file" />
        <button type="submit">Upload</button>
    </form>

    <nav id="breadcrumbs"></nav>

    <ul id="file-list"></ul>

    <script src="app.js"></script>
</body>
</html>
